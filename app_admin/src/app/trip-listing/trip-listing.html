<div class="container mt-4">

  <div class="row mb-3">
    <div class="col">
      <button (click)="addTrip()" class="btn btn-primary">
        Add Trip
      </button>
    </div>
  </div>


  <div class="row">
    <div *ngFor="let trip of trips" class="col-sm-12 col-md-6 col-lg-4 mb-4">
      <app-trip-card [trip]="trip"></app-trip-card>
    </div>
  </div>

</div>
