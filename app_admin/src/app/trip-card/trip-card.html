<div class="card h-100">

  <img
    [src]="'/images/' + trip.image"
    alt="trip thumbnail"
    class="card-img-top"
  >

  <div class="card-body">
    <h3 class="card-title">{{ trip.name }}</h3>

    <p><strong>Code:</strong> {{ trip.code }}</p>
    <p><strong>Length:</strong> {{ trip.length }}</p>
    <p><strong>Resort:</strong> {{ trip.resort }}</p>
    <p><strong>Price:</strong> {{ trip.perPerson | currency:'USD' }}</p>
    <p>{{ trip.description }}</p>

    <a
      *ngIf="isLoggedIn()"
      class="btn btn-warning"
      [routerLink]="['/edit-trip', trip.code]"
    >
      Edit
    </a>

    <button
      *ngIf="isLoggedIn()"
      type="button"
      class="btn btn-danger ms-2"
      (click)="deleteTrip()"
    >
      Delete
    </button>

  </div>
</div>
